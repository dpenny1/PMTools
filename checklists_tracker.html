<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Installation Checklists</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:#f9fafb;color:#1a1a1a;min-height:100vh;font-size:16px}
.header{background:linear-gradient(135deg,#b45309,#f59e0b);padding:16px 24px;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{color:white;font-weight:700;font-size:1.3rem;margin:0}
.header p{color:rgba(255,255,255,0.85);font-size:0.85rem;margin-top:2px}
.header-btns{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back-btn{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);border-radius:8px;padding:7px 16px;font-size:0.9rem;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.back-btn:hover{background:rgba(255,255,255,0.25)}
.badge-white{background:rgba(255,255,255,0.2);color:white;font-size:0.9rem;padding:4px 14px;border-radius:999px;font-weight:600}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:0.9rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-refresh{background:white;color:#b45309}.btn-refresh:hover{background:#fef3c7}
.main{max-width:1100px;margin:0 auto;padding:24px 16px}
.error-box{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:14px;color:#991b1b;font-size:1rem;margin-bottom:16px}
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.sum-card{border-radius:10px;padding:16px;text-align:center;border-width:2px;border-style:solid}
.sum-card .num{font-size:2.2rem;font-weight:800}
.sum-card .lbl{font-size:0.85rem;font-weight:700;margin-top:3px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
.controls input,.controls select{border:1px solid #e5e7eb;border-radius:8px;padding:9px 14px;font-size:0.95rem;background:white;outline:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.cl-card{background:white;border-radius:12px;overflow:hidden;border-width:2px;border-style:solid}
.cl-card-hdr{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.cl-card-hdr:hover{filter:brightness(0.97)}
.cl-urgency-bar{width:6px;height:44px;border-radius:3px;flex-shrink:0}
.cl-hdr-info{flex:1;min-width:0}
.cl-title{font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-subtitle{font-size:0.8rem;color:#6b7280;margin-top:2px}
.cl-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.urgency-badge{font-size:0.75rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.expand-icon{font-size:0.8rem;color:#9ca3af;transition:transform 0.2s;flex-shrink:0}
.expand-icon.open{transform:rotate(180deg)}
.progress-wrap{padding:4px 16px 10px}
.progress-bar{height:6px;border-radius:999px;background:#e5e7eb;overflow:hidden;margin-bottom:4px}
.progress-fill{height:100%;border-radius:999px;transition:width 0.4s}
.progress-lbl{font-size:0.75rem;color:#6b7280;text-align:right}
.outstanding-hint{font-size:0.8rem;padding:0 16px 10px}
.subtask-list{border-top:1px solid #f3f4f6;display:none}
.subtask-list.open{display:block}
.st-row{display:flex;align-items:flex-start;gap:10px;padding:9px 16px;border-bottom:1px solid #f9fafb}
.st-row:last-child{border-bottom:none}
.st-row:hover{background:#fafafa}
.st-check{width:18px;height:18px;border-radius:4px;border:2px solid #d1d5db;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.st-check.done{background:#10b981;border-color:#10b981;color:white}
.st-info{flex:1;min-width:0}
.st-name{font-size:0.9rem;color:#374151}
.st-name.done{text-decoration:line-through;color:#9ca3af}
.st-due{font-size:0.78rem;font-weight:600;margin-top:3px}
.loading{text-align:center;padding:48px;color:#6b7280;font-size:1rem}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fde68a;border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:#9ca3af;font-size:1rem;padding:40px}
.footer{text-align:center;font-size:0.82rem;color:#9ca3af;margin-top:28px;padding-bottom:24px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.summary-bar{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div><h1>&#x2705; Installation Checklists</h1><p>Subtask completion tracker &middot; Live from Asana</p></div>
    <div class="header-btns">
      <a class="back-btn" href="index.html">&#8592; CentralView Hub</a>
      <span class="badge-white" id="total-badge" style="display:none"></span>
      <span id="last-refresh" style="color:rgba(255,255,255,0.85);font-size:0.85rem"></span>
      <button class="btn btn-refresh" id="btn-refresh" onclick="loadData()" style="display:none">&#x1F504; Refresh</button>
    </div>
  </div>
</div>
<div class="main">
  <div id="error-area"></div>
  <div id="loading-area"></div>
  <div id="dashboard" style="display:none">
    <div class="summary-bar">
      <div class="sum-card" style="background:#f0fdf4;border-color:#bbf7d0"><div class="num" style="color:#10b981" id="s-complete">0</div><div class="lbl" style="color:#065f46">Complete</div></div>
      <div class="sum-card" style="background:#eff6ff;border-color:#bfdbfe"><div class="num" style="color:#3b82f6" id="s-ontrack">0</div><div class="lbl" style="color:#1e40af">On Track</div></div>
      <div class="sum-card" style="background:#fffbeb;border-color:#fde68a"><div class="num" style="color:#f59e0b" id="s-atrisk">0</div><div class="lbl" style="color:#92400e">At Risk (&le;14 days)</div></div>
      <div class="sum-card" style="background:#fef2f2;border-color:#fecaca"><div class="num" style="color:#ef4444" id="s-overdue">0</div><div class="lbl" style="color:#991b1b">Danger (&le;7 days)</div></div>
    </div>
    <div class="controls">
      <input type="text" id="search" placeholder="&#x1F50D; Search installations..." oninput="renderGrid()" style="width:260px"/>
      <select id="filter-urgency" onchange="renderGrid()">
        <option value="">All Urgency Levels</option>
        <option value="overdue">Danger (&le;7 days)</option>
        <option value="atrisk">At Risk (&le;14 days)</option>
        <option value="ontrack">On Track</option>
        <option value="complete">Complete</option>
        <option value="nodate">No Due Date</option>
      </select>
      <select id="sort-by" onchange="renderGrid()">
        <option value="urgency">Sort: Urgency</option>
        <option value="name">Sort: Name A-Z</option>
        <option value="due">Sort: Due Date</option>
        <option value="pct">Sort: % Complete</option>
      </select>
    </div>
    <div id="grid" class="grid"></div>
  </div>
  <p class="footer">Data pulled live from Asana &middot; Installation Checklists &middot; Auto-refreshes every 15 minutes</p>
</div>
<script>
var ASANA_BASE="https://app.asana.com/api/1.0",PROJECT_GID="1213736136206851";
var allItems=[],refreshTimer=null;
var URGENCY_ORDER={overdue:0,atrisk:1,ontrack:2,complete:2,nodate:3};
var URGENCY_META={
  complete:{bg:"#f0fdf4",border:"#bbf7d0",bar:"#10b981",text:"#065f46",label:"Complete"},
  ontrack: {bg:"#eff6ff",border:"#bfdbfe",bar:"#3b82f6",text:"#1e40af",label:"On Track"},
  atrisk:  {bg:"#fffbeb",border:"#fde68a",bar:"#f59e0b",text:"#92400e",label:"At Risk (\u226414 days)"},
  overdue: {bg:"#fef2f2",border:"#fecaca",bar:"#ef4444",text:"#991b1b",label:"Danger (\u22647 days)"},
  nodate:  {bg:"#f9fafb",border:"#e5e7eb",bar:"#9ca3af",text:"#6b7280",label:"No Date"}
};
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtDate(d){try{return new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}catch(e){return d;}}
function showError(msg){document.getElementById("error-area").innerHTML="<div class='error-box'>&#x274C; "+msg+"</div>";}
function clearError(){document.getElementById("error-area").innerHTML="";}
function setLoading(m){document.getElementById("loading-area").innerHTML="<div class='loading'><span class='spin'></span>"+esc(m)+"</div>";}
function clearLoading(){document.getElementById("loading-area").innerHTML="";}
function getToken(){return sessionStorage.getItem("asana_token_cl")||sessionStorage.getItem("asana_token_hub")||"";}
function apiFetch(url){return fetch(url,{headers:{"Authorization":"Bearer "+getToken(),"Accept":"application/json"}}).then(function(r){if(!r.ok)return r.text().then(function(txt){throw new Error("Asana "+r.status+": "+txt);});return r.json();});}
function fetchAllPages(path){var base=ASANA_BASE+path,acc=[];function go(url){return apiFetch(url).then(function(json){acc=acc.concat(json.data||[]);if(json.next_page&&json.next_page.offset){var sep=base.indexOf("?")>=0?"&":"?";return go(base+sep+"offset="+encodeURIComponent(json.next_page.offset));}return acc;});}return go(base);}
window.onload=function(){
  var urlParam=new URLSearchParams(window.location.search).get("token");
  if(urlParam)sessionStorage.setItem("asana_token_cl",urlParam);
  var t=getToken();
  if(!t){showError("No token found. Go back to <a href='index.html'>CentralView Hub</a>, enter your token, then return here.");}
  else{loadData();}
};
function loadData(){
  var token=getToken();
  if(!token){showError("No token found. Go back to <a href='index.html'>CentralView Hub</a>, enter your token, then return here.");return;}
  clearError();
  setLoading("Loading installations...");
  document.getElementById("dashboard").style.display="none";
  document.getElementById("btn-refresh").style.display="none";
  document.getElementById("total-badge").style.display="none";
  fetchAllPages("/projects/"+PROJECT_GID+"/tasks?opt_fields=gid,name,completed,due_on&limit=100")
  .then(function(tasks){
    var open=tasks.filter(function(t){return !t.completed;});
    if(open.length===0){clearLoading();allItems=[];renderSummary();renderGrid();document.getElementById("dashboard").style.display="block";document.getElementById("btn-refresh").style.display="inline-flex";return;}
    allItems=[];var done=0;
    open.forEach(function(task){
      setLoading("Loading subtasks... ("+done+" of "+open.length+")");
      apiFetch(ASANA_BASE+"/tasks/"+task.gid+"/subtasks?opt_fields=gid,name,completed,due_on&limit=100")
      .then(function(sj){
        var subs=sj.data||[];
        var totalSubs=subs.length,completedSubs=subs.filter(function(s){return s.completed;}).length;
        var remaining=totalSubs-completedSubs,pct=totalSubs>0?Math.round((completedSubs/totalSubs)*100):0;
        var daysLeft=task.due_on?Math.ceil((new Date(task.due_on+"T00:00:00")-new Date())/86400000):null;
        var urgency;
        if(remaining===0)urgency="complete";
        else if(daysLeft===null)urgency="nodate";
        else if(daysLeft<=7)urgency="overdue";
        else if(daysLeft<=14)urgency="atrisk";
        else urgency="ontrack";
        var taggedSubs=subs.map(function(s){
          var sd=s.due_on?Math.ceil((new Date(s.due_on+"T00:00:00")-new Date())/86400000):null;
          var su;
          if(s.completed)su="complete";
          else if(sd===null)su="nodate";
          else if(sd<=7)su="overdue";
          else if(sd<=14)su="atrisk";
          else su="ontrack";
          return{gid:s.gid,name:s.name,completed:s.completed,due:s.due_on||"",daysLeft:sd,urgency:su};
        });
        return apiFetch(ASANA_BASE+"/tasks/"+task.gid+"?opt_fields=parent.name")
        .then(function(pj){
          var displayName=(pj.data&&pj.data.parent&&pj.data.parent.name)?pj.data.parent.name:task.name;
          allItems.push({gid:task.gid,name:displayName,due:task.due_on||"",daysLeft:daysLeft,totalSubs:totalSubs,completedSubs:completedSubs,remaining:remaining,pct:pct,urgency:urgency,subtasks:taggedSubs});
        }).catch(function(){
          allItems.push({gid:task.gid,name:task.name,due:task.due_on||"",daysLeft:daysLeft,totalSubs:totalSubs,completedSubs:completedSubs,remaining:remaining,pct:pct,urgency:urgency,subtasks:taggedSubs});
        });
      }).catch(function(){
        allItems.push({gid:task.gid,name:task.name,due:task.due_on||"",daysLeft:null,totalSubs:0,completedSubs:0,remaining:0,pct:0,urgency:"nodate",subtasks:[]});
      }).finally(function(){
        done++;
        if(done===open.length){
          clearLoading();renderSummary();renderGrid();
          document.getElementById("dashboard").style.display="block";
          document.getElementById("btn-refresh").style.display="inline-flex";
          var tb=document.getElementById("total-badge");tb.style.display="inline-block";tb.textContent=open.length+" installations";
          document.getElementById("last-refresh").textContent="Refreshed "+new Date().toLocaleTimeString();
          if(refreshTimer)clearInterval(refreshTimer);
          refreshTimer=setInterval(loadData,15*60*1000);
        }
      });
    });
  }).catch(function(e){clearLoading();showError(esc(e.message));});
}
function renderSummary(){
  var counts={complete:0,ontrack:0,atrisk:0,overdue:0,nodate:0};
  allItems.forEach(function(it){if(counts[it.urgency]!==undefined)counts[it.urgency]++;});
  document.getElementById("s-complete").textContent=counts.complete;
  document.getElementById("s-ontrack").textContent=counts.ontrack;
  document.getElementById("s-atrisk").textContent=counts.atrisk;
  document.getElementById("s-overdue").textContent=counts.overdue;
}
function renderGrid(){
  var search=document.getElementById("search").value.toLowerCase();
  var furg=document.getElementById("filter-urgency").value;
  var sortBy=document.getElementById("sort-by").value;
  var items=allItems.slice();
  if(search)items=items.filter(function(it){return it.name.toLowerCase().indexOf(search)>=0;});
  if(furg)items=items.filter(function(it){return it.urgency===furg;});
  items.sort(function(a,b){
    if(sortBy==="name")return a.name.localeCompare(b.name);
    if(sortBy==="due"){var ad=a.daysLeft===null?9999:a.daysLeft,bd=b.daysLeft===null?9999:b.daysLeft;return ad-bd;}
    if(sortBy==="pct")return a.pct-b.pct;
    // Default: urgency sort
    var ao=URGENCY_ORDER[a.urgency]||0,bo=URGENCY_ORDER[b.urgency]||0;
    if(ao!==bo)return ao-bo;
    // Within danger/atrisk: sort by days left ascending
    if(a.urgency==="overdue"||a.urgency==="atrisk"){
      var ad2=a.daysLeft===null?9999:a.daysLeft,bd2=b.daysLeft===null?9999:b.daysLeft;
      return ad2-bd2;
    }
    // Within ontrack/complete/nodate: sort by due date ascending, no date goes last
    var ad3=a.daysLeft===null?9999:a.daysLeft,bd3=b.daysLeft===null?9999:b.daysLeft;
    if(ad3!==bd3)return ad3-bd3;
    // If same due date (or both no date), sort by urgency order as tiebreaker
    return ao-bo;
  });
  var grid=document.getElementById("grid");
  if(items.length===0){grid.innerHTML="<p class='empty' style='grid-column:span 2'>No installations match your filter.</p>";return;}
  grid.innerHTML=items.map(function(it){
    var um=URGENCY_META[it.urgency]||URGENCY_META.nodate;
    var autoOpen=it.urgency==="overdue"||it.urgency==="atrisk";
    var dueText=it.due?fmtDate(it.due):"No due date";
    if(it.daysLeft!==null&&it.urgency!=="complete"){dueText+=it.daysLeft<0?" ("+Math.abs(it.daysLeft)+"d overdue)":it.daysLeft===0?" (due today)":" ("+it.daysLeft+"d left)";}
    var outstanding=it.subtasks.filter(function(s){return !s.completed;});
    outstanding.sort(function(a,b){return(URGENCY_ORDER[a.urgency]||0)-(URGENCY_ORDER[b.urgency]||0);});
    var subtaskRows=it.subtasks.map(function(s){
      var bg="";
      if(!s.completed){if(s.urgency==="overdue")bg="background:#fef2f2;";else if(s.urgency==="atrisk")bg="background:#fffbeb;";}
      var stDue="";
      if(s.due&&!s.completed){var dc=s.urgency==="overdue"?"#ef4444":s.urgency==="atrisk"?"#f59e0b":"#6b7280";var dl=s.daysLeft<0?Math.abs(s.daysLeft)+"d overdue":s.daysLeft===0?"Due today":s.daysLeft+"d left";stDue="<div class='st-due' style='color:"+dc+"'>"+fmtDate(s.due)+" &mdash; "+dl+"</div>";}
      else if(s.due&&s.completed){stDue="<div class='st-due' style='color:#9ca3af'>"+fmtDate(s.due)+"</div>";}
      return"<div class='st-row' style='"+bg+"'><div class='st-check "+(s.completed?"done":"")+"'>"+(s.completed?"&#x2713;":"")+"</div><div class='st-info'><div class='st-name "+(s.completed?"done":"")+"'>"+esc(s.name)+"</div>"+stDue+"</div></div>";
    }).join("");
    var outstandingHint="";
    if(outstanding.length>0&&it.urgency!=="complete"){
      var first=outstanding[0],fum=URGENCY_META[first.urgency]||URGENCY_META.nodate;
      outstandingHint="<div class='outstanding-hint' style='color:"+fum.text+"'>&#x26A0; Next outstanding: <strong>"+esc(first.name)+"</strong>"+(first.due?" &mdash; "+fmtDate(first.due):"")+
      " ("+outstanding.length+" item"+(outstanding.length!==1?"s":"")+" remaining)</div>";
    }
    return"<div class='cl-card' style='border-color:"+um.border+";background:"+um.bg+"' id='card-"+it.gid+"'>"+
      "<div class='cl-card-hdr' onclick='toggleCard(\""+it.gid+"\")'>"+
        "<div class='cl-urgency-bar' style='background:"+um.bar+"'></div>"+
        "<div class='cl-hdr-info'>"+
          "<div class='cl-title'>"+esc(it.name)+"</div>"+
          "<div class='cl-subtitle'>"+dueText+"&nbsp;&nbsp;&#x2022;&nbsp;&nbsp;"+it.completedSubs+"/"+it.totalSubs+" steps complete</div>"+
        "</div>"+
        "<div class='cl-meta'>"+
          "<span class='urgency-badge' style='background:"+um.bar+"22;color:"+um.text+";border:1px solid "+um.border+"'>"+um.label+"</span>"+
          "<span class='expand-icon"+(autoOpen?" open":"")+"' id='icon-"+it.gid+"'>&#9660;</span>"+
        "</div>"+
      "</div>"+
      "<div class='progress-wrap'>"+
        "<div class='progress-bar'><div class='progress-fill' style='width:"+it.pct+"%;background:"+um.bar+"'></div></div>"+
        "<div class='progress-lbl'>"+it.pct+"% complete</div>"+
      "</div>"+
      outstandingHint+
      "<div class='subtask-list"+(autoOpen?" open":"")+"' id='subs-"+it.gid+"'>"+subtaskRows+"</div>"+
    "</div>";
  }).join("");
}
function toggleCard(gid){
  var list=document.getElementById("subs-"+gid),icon=document.getElementById("icon-"+gid);
  if(list.classList.contains("open")){list.classList.remove("open");icon.classList.remove("open");}
  else{list.classList.add("open");icon.classList.add("open");}
}
</script>
</body>
</html>
